name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  release-consistency:
    name: Release consistency (versions + committed bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      # Sans argument, le script ne modifie rien : il échoue si les neuf
      # numéros de version du dépôt ne s'accordent pas (Phase 10.2).
      - name: Check version numbers agree
        run: uv run --no-project python scripts/sync-versions.py

      # Le paquet CLI embarque datavortex/static/ tel qu'il est commité, sans
      # jamais lancer Node : ces tests échouent si le bundle est absent,
      # incohérent, ou ne contient pas les fonctionnalités récentes du
      # frontend — autrement dit si ./build.sh n'a pas été relancé.
      - name: Install CLI package
        working-directory: datavortex-cli
        run: uv sync --extra dev

      - name: Test CLI package and committed bundle
        working-directory: datavortex-cli
        run: uv run pytest -v
