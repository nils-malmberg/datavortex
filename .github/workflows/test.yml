name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    # Phase 10.3 : les dépendances sont des intervalles ; le lock (versions
    # les plus récentes) est testé sur chaque Python de requires-python.
    name: Backend (pytest + ruff, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python }} --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v

  backend-windows:
    # Windows n'a jamais été couvert : c'est là que TensorFlow >= 2.16 a cassé
    # (v1.2.3, poste d'entreprise). Ce job vérifie que la résolution Windows
    # retient bien la 2.15, qu'elle se charge, et que la suite passe.
    name: Backend (Windows, TensorFlow 2.15)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11 --extra dev

      # Le processeur du runner apparaît dans le journal : `tensorflow-intel`
      # est la build Windows de TensorFlow (maintenue par Intel), pas une
      # build réservée aux processeurs Intel — elle doit se charger sur AMD.
      - name: Show CPU
        run: Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name

      - name: TensorFlow resolves to 2.15 and loads
        run: uv run python -c "import tensorflow as tf; assert tf.__version__.startswith('2.15.'), tf.__version__; print('TensorFlow', tf.__version__)"

      # Plafond : kaleido 0.2.1 bloquait `to_image` indéfiniment sur Windows
      # (d'où le marqueur kaleido de pyproject.toml) ; un blocage doit
      # échouer vite, pas occuper le runner six heures.
      - name: Run tests
        timeout-minutes: 15
        run: uv run pytest -q -p no:cacheprovider

  backend-lowest:
    # L'autre extrémité des intervalles : chaque dépendance directe à son
    # plancher. Si ce job casse, c'est qu'un plancher de pyproject.toml est
    # trop bas (ou que le code vient d'utiliser une API plus récente).
    name: Backend (lowest allowed versions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Resolve every direct dependency to its floor
        run: uv pip compile --resolution lowest-direct --python-version 3.10 --extra dev pyproject.toml -o lowest.txt

      - name: Install
        run: |
          uv venv --python 3.10 .venv-lowest
          uv pip install --python .venv-lowest/bin/python -r lowest.txt

      - name: Run tests
        run: .venv-lowest/bin/python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  release-consistency:
    name: Release consistency (versions + committed bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      # Sans argument, le script ne modifie rien : il échoue si les neuf
      # numéros de version du dépôt ne s'accordent pas (Phase 10.2).
      - name: Check version numbers agree
        run: uv run --no-project python scripts/sync-versions.py

      # Le paquet CLI embarque datavortex/static/ tel qu'il est commité, sans
      # jamais lancer Node : ces tests échouent si le bundle est absent,
      # incohérent, ou ne contient pas les fonctionnalités récentes du
      # frontend — autrement dit si ./build.sh n'a pas été relancé.
      - name: Install CLI package
        working-directory: datavortex-cli
        run: uv sync --extra dev

      - name: Test CLI package and committed bundle
        working-directory: datavortex-cli
        run: uv run pytest -v
