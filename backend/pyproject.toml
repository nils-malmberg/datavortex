[project]
name = "datavortex-backend"
version = "1.0.0"
description = "DataVortex - Backend FastAPI pour visualisation et analyse de données"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pandas==2.1.0",
    "numpy==1.24.0",
    "scipy==1.11.0",
    "plotly==5.17.0",
    "python-multipart==0.0.6",
    "chardet==5.2.0",
    "openpyxl==3.1.2",
    "kaleido==0.2.1",
    "reportlab==4.2.5",
    "scikit-learn==1.3.2",
    "matplotlib==3.8.2",
    "jinja2==3.1.4",
    "skl2onnx==1.20.0",
    "onnx==1.16.1",
    "tensorflow-cpu==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "black==23.11.0",
    "httpx==0.25.0",
    "ruff==0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
